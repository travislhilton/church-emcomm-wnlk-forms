<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Church of Jesus Christ EMCOMM</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;}

/* ── Top bar ── */
#bar{
  position:fixed;top:0;left:0;right:0;height:40px;z-index:200;
  background:rgba(0,0,0,.75);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:10px;padding:0 14px;
  color:#e0e0e0;font-size:13px;user-select:none;
}
#bar button{
  background:rgba(255,255,255,.12);border:none;color:#e0e0e0;
  padding:4px 12px;border-radius:5px;font-size:13px;cursor:pointer;
  font-family:inherit;transition:background .1s;
}
#bar button:hover{background:rgba(255,255,255,.22);}
#bar .sep{width:1px;height:20px;background:rgba(255,255,255,.2);}
#bar .spacer{flex:1;}
#slide-counter{font-size:13px;opacity:.8;min-width:60px;text-align:center;}

/* ── Stage ── */
#stage{
  position:fixed;top:40px;left:0;right:0;bottom:0;
  display:block;
  overflow:hidden;
}
/* The scaler is positioned by scaleSlide() margins, so the stage must not be a
   flex container: flex-shrink would squeeze the 1920px box whenever the window
   is narrower than 1920px + margin, and every slide would wrap differently. */

/* ── Slide wrapper: 1920×1080 scaled to fit ── */
#slide-scaler{
  width:1920px;height:1080px;flex-shrink:0;
  transform-origin:top left;
  position:relative;
  overflow:hidden;
}
#slide-scaler section{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  position:relative;
}
/* hide speaker notes */
#slide-scaler aside{display:none;}

/* ── Overflow fix: reclaim padding on all content slides ── */
#slide-scaler section:not([id="cover"]):not([id="disaster-strike"]) {
  padding-top: 80px !important;
  padding-bottom: 100px !important;
}

/* ── Sidebar ── */
#sidebar{
  position:fixed;top:40px;left:0;bottom:0;width:260px;z-index:100;
  background:rgba(10,10,20,.93);backdrop-filter:blur(10px);
  overflow-y:auto;padding:12px 8px;
  transform:translateX(-100%);transition:transform .2s;
}
#sidebar.open{transform:translateX(0);}
.sitem{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;
  cursor:pointer;color:#bbb;font-size:12px;transition:background .1s;
  border:1px solid transparent;
}
.sitem:hover{background:rgba(255,255,255,.08);}
.sitem.active{background:rgba(200,16,46,.2);border-color:#C8102E;color:#fff;}
.sitem .sn{font-size:11px;min-width:22px;color:#666;font-family:monospace;}
.sitem .st{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── Loading ── */
#loading{position:fixed;inset:0;background:#111;display:flex;align-items:center;justify-content:center;z-index:999;color:#eee;font-size:20px;}
#loading.hidden{display:none;}

/* ── Nav arrows (edge zones) ── */
.nav-edge{
  position:fixed;top:40px;bottom:0;width:60px;z-index:150;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,0);transition:color .2s;
  font-size:36px;
}
.nav-edge:hover{color:rgba(255,255,255,.5);}
#nav-prev{left:0;}
#nav-next{right:0;}
</style>
</head>
<body>

<div id="loading">Loading slides…</div>

<!-- Top bar -->
<div id="bar">
  <button id="btn-list" title="Toggle slide list (S)">☰ List</button>
  <div class="sep"></div>
  <button id="btn-prev" title="Previous (←)">◀</button>
  <div id="slide-counter">1 / 28</div>
  <button id="btn-next" title="Next (→)">▶</button>
  <div class="sep"></div>
  <span id="slide-title" style="opacity:.7;max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
  <div class="spacer"></div>
  <span style="opacity:.4;font-size:11px">← → navigate &nbsp;·&nbsp; S toggle list &nbsp;·&nbsp; F fullscreen</span>
</div>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-list"></div>
</div>

<!-- Stage -->
<div id="stage">
  <div id="slide-scaler">
    <!-- slides injected here -->
  </div>
</div>

<!-- Edge nav -->
<div class="nav-edge" id="nav-prev">&#8249;</div>
<div class="nav-edge" id="nav-next">&#8250;</div>

<script>
// ── Custom element polyfills ──────────────────────────────────────────────────

// x-connector: invisible connector lines — just hide
customElements.define('x-connector', class extends HTMLElement {
  connectedCallback() { this.style.display = 'none'; }
});

// x-shape: currently only kind="arrow-right" used
customElements.define('x-shape', class extends HTMLElement {
  connectedCallback() { this._render(); }
  _render() {
    var kind = this.getAttribute('kind') || 'arrow-right';
    var s = this.style;
    var w = parseFloat(s.width) || 20;
    var h = parseFloat(s.height) || 14;
    var color = s.background || s.backgroundColor || '#999';
    this.style.display = 'inline-block';
    this.style.width = '0';
    this.style.height = '0';
    this.style.background = 'transparent';
    this.style.borderTop = (h/2) + 'px solid transparent';
    this.style.borderBottom = (h/2) + 'px solid transparent';
    this.style.borderLeft = w + 'px solid ' + color;
    this.style.flexShrink = '0';
  }
});

// x-icon: named SVG icons
customElements.define('x-icon', class extends HTMLElement {
  connectedCallback() { this._render(); }
  _render() {
    var name = this.getAttribute('name') || '';
    var color = this.style.color || '#fff';
    var w = parseFloat(this.style.width) || 24;
    var h = parseFloat(this.style.height) || 24;
    var paths = {
      'Users': '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="'+color+'" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke="'+color+'" stroke-width="2" fill="none"/><path d="M23 21v-2a4 4 0 0 0-3-3.87" stroke="'+color+'" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M16 3.13a4 4 0 0 1 0 7.75" stroke="'+color+'" stroke-width="2" fill="none" stroke-linecap="round"/>',
      'Tool': '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" stroke="'+color+'" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
      'Settings': '<circle cx="12" cy="12" r="3" stroke="'+color+'" stroke-width="2" fill="none"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="'+color+'" stroke-width="2" fill="none"/>',
      'Database': '<ellipse cx="12" cy="5" rx="9" ry="3" stroke="'+color+'" stroke-width="2" fill="none"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" stroke="'+color+'" stroke-width="2" fill="none"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" stroke="'+color+'" stroke-width="2" fill="none"/>'
    };
    var inner = paths[name] || '<circle cx="12" cy="12" r="10" stroke="'+color+'" stroke-width="2" fill="none"/>';
    this.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 24 24">'+inner+'</svg>';
    this.style.display = 'inline-flex';
    this.style.alignItems = 'center';
    this.style.justifyContent = 'center';
    this.style.flexShrink = '0';
  }
});

// ── Deck loader ───────────────────────────────────────────────────────────────
var slides = [];
var cur = 0;

function scaleSlide() {
  var stageW = window.innerWidth;
  var stageH = window.innerHeight - 40;
  var scaleX = stageW / 1920;
  var scaleY = stageH / 1080;
  var scale = Math.min(scaleX, scaleY);
  var el = document.getElementById('slide-scaler');
  el.style.transform = 'scale('+scale+')';
  el.style.marginLeft = Math.round((stageW - 1920*scale)/2) + 'px';
  el.style.marginTop = Math.round((stageH - 1080*scale)/2) + 'px';
}

function showSlide(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  var scaler = document.getElementById('slide-scaler');
  scaler.innerHTML = slides[idx].html;
  // Run polyfills on injected elements
  scaler.querySelectorAll('x-shape').forEach(function(el){ if (el._render) el._render(); });
  scaler.querySelectorAll('x-icon').forEach(function(el){ if (el._render) el._render(); });

  document.getElementById('slide-counter').textContent = (idx+1) + ' / ' + slides.length;
  document.getElementById('slide-title').textContent = slides[idx].title;
  document.querySelectorAll('.sitem').forEach(function(el,i){
    el.classList.toggle('active', i===idx);
  });
  // Scroll sidebar item into view
  var activeItem = document.querySelector('.sitem.active');
  if (activeItem) activeItem.scrollIntoView({block:'nearest'});
}

function loadDeck() {
  fetch('deck.json')
    .then(function(r){ return r.json(); })
    .then(function(deck) {
      var order = deck.order;
      var fetches = order.map(function(id) {
        return fetch('slides/'+id+'.html')
          .then(function(r){ return r.text(); })
          .then(function(html) {
            // Extract title from the section's first heading or eyebrow
            var titleMatch = html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/);
            var eyebrowMatch = html.match(/text-transform:uppercase[^>]*>([^<]+)<\/p>/);
            var rawTitle = titleMatch ? titleMatch[1].replace(/<[^>]+>/g,'').trim() : (eyebrowMatch ? eyebrowMatch[1].trim() : id);
            // Decode HTML entities
            var tmp = document.createElement('div'); tmp.innerHTML = rawTitle;
            var title = tmp.textContent || rawTitle;
            return { id: id, html: html, title: title.substring(0,50) };
          });
      });
      return Promise.all(fetches);
    })
    .then(function(loaded) {
      slides = loaded;
      // Build sidebar
      var list = document.getElementById('sidebar-list');
      list.innerHTML = slides.map(function(s, i) {
        return '<div class="sitem" onclick="showSlide('+i+')" data-idx="'+i+'"><span class="sn">'+(i+1)+'</span><span class="st">'+escHtml(s.title)+'</span></div>';
      }).join('');
      document.getElementById('loading').classList.add('hidden');
      showSlide(0);
      scaleSlide();
    })
    .catch(function(err) {
      document.getElementById('loading').textContent = 'Error loading slides: ' + err.message;
    });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Navigation ────────────────────────────────────────────────────────────────
document.getElementById('btn-prev').addEventListener('click', function(){ showSlide(cur-1); });
document.getElementById('btn-next').addEventListener('click', function(){ showSlide(cur+1); });
document.getElementById('nav-prev').addEventListener('click', function(){ showSlide(cur-1); });
document.getElementById('nav-next').addEventListener('click', function(){ showSlide(cur+1); });

document.getElementById('btn-list').addEventListener('click', function(){
  document.getElementById('sidebar').classList.toggle('open');
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); showSlide(cur-1); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); showSlide(cur+1); }
  if (e.key === 's' || e.key === 'S') document.getElementById('sidebar').classList.toggle('open');
  if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){});
    else document.exitFullscreen();
  }
  if (e.key === 'Home') showSlide(0);
  if (e.key === 'End') showSlide(slides.length-1);
});

window.addEventListener('resize', scaleSlide);
document.addEventListener('fullscreenchange', function(){ setTimeout(scaleSlide, 100); });

loadDeck();
</script>
</body>
</html>
